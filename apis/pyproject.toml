[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "estatehub-api"
version = "0.1.0"
description = "EstateHub FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi[standard]>=0.162,<0.163",
  "pillow>=12.3,<13",
  "pwdlib[argon2]>=0.3,<0.4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pyjwt>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0.44,<2.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery"]
ignore_missing_imports = true
